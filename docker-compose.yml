services:
  perpendicular:
    build: .
    container_name: perpendicular
    restart: unless-stopped
    ports:
      - "3333:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEFAULT_COMPANY_ID: ${DEFAULT_COMPANY_ID:-blueblood-demo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - perpendicular_data:/app/data

volumes:
  perpendicular_data:
